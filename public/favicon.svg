<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- TruckWys Logo - 6-blade pinwheel/turbine -->
  <g fill="#1a1a1a" transform="translate(50,50)">
    <!-- 6 blades rotated 60° apart, counter-clockwise sweep -->
    <polygon points="0,-8 -15,-38 5,-42 12,-12" transform="rotate(0)"/>
    <polygon points="0,-8 -15,-38 5,-42 12,-12" transform="rotate(60)"/>
    <polygon points="0,-8 -15,-38 5,-42 12,-12" transform="rotate(120)"/>
    <polygon points="0,-8 -15,-38 5,-42 12,-12" transform="rotate(180)"/>
    <polygon points="0,-8 -15,-38 5,-42 12,-12" transform="rotate(240)"/>
    <polygon points="0,-8 -15,-38 5,-42 12,-12" transform="rotate(300)"/>
  </g>
</svg>
